name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ruah-cli

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
        working-directory: ruah-cli

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: ruah-cli

      - name: Lint
        run: npx biome check .
        working-directory: ruah-cli

      - name: Build
        run: npm run build
        working-directory: ruah-cli

      - name: Test CLI
        run: npm test
        working-directory: ruah-cli

  publish-npm:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: ruah-cli

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
        working-directory: ruah-cli

      - name: Build
        run: npm run build
        working-directory: ruah-cli

      - name: Publish with provenance
        run: npm publish --access public --provenance --ignore-scripts
        working-directory: ruah-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ruah-cli
          fetch-depth: 0

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "ruah CLI $TAG" \
            --generate-notes \
            --verify-tag
        working-directory: ruah-cli
